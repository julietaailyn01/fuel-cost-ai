services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fuel-cost-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fuel-cost-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
